<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111318">
  <link rel="icon" href="/icon.svg">
  <link rel="apple-touch-icon" href="/icon-180.png">
  <title>登录</title>
  <style>
    :root { --bg:#111318; --panel:#181b22; --line:#262a34; --text:#e6e8ee; --accent:#7c9cff; --danger:#ff6b6b; color-scheme: dark; }
    @media (prefers-color-scheme: light) { :root { --bg:#fff; --panel:#f5f6f8; --line:#e3e5ea; --text:#1a1c21; --accent:#3b5bdb; --danger:#d63b3b; color-scheme: light; } }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100dvh; display:grid; place-items:center; background:var(--bg); color:var(--text); font:16px/1.5 -apple-system,"PingFang SC",system-ui,sans-serif; }
    form { width:min(340px,86vw); display:flex; flex-direction:column; gap:12px; }
    input, button { font:inherit; color:inherit; padding:12px 14px; border-radius:12px; border:1px solid var(--line); background:var(--panel); }
    input:focus { outline:none; border-color:var(--accent); }
    button { background:var(--accent); border-color:var(--accent); color:#fff; cursor:pointer; }
    button:disabled { opacity:.5; }
    #err { color:var(--danger); min-height:1.5em; font-size:14px; }
  </style>
</head>
<body>
  <form id="f">
    <input id="pw" type="password" placeholder="密码" autocomplete="current-password" autofocus required>
    <div id="err"></div>
    <button id="go">进入</button>
  </form>
  <script>
    document.getElementById("f").addEventListener("submit", async (e) => {
      e.preventDefault();
      const go = document.getElementById("go"), err = document.getElementById("err");
      go.disabled = true; err.textContent = "";
      try {
        const res = await fetch("/login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ password: document.getElementById("pw").value }) });
        if (res.ok) return (location.href = "/");
        err.textContent = (await res.json().catch(() => ({}))).error || "登录失败";
      } catch { err.textContent = "网络错误"; }
      go.disabled = false;
    });
  </script>
</body>
</html>
