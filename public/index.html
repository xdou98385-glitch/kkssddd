<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#efefed">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#121314">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Chat">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icon-180.png">
  <link rel="icon" href="/icon-192.png">
  <link rel="stylesheet" href="/style.css">
  <title>Chat</title>
</head>
<body>
  <main>
    <header>
      <span class="spacer"></span>
      <h1 id="title">Claude</h1>
      <button id="settings-btn" class="round" type="button" aria-label="设置">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg>
      </button>
    </header>

    <div id="messages" aria-live="polite">
      <div class="skeleton" aria-hidden="true"><i></i><i></i><i></i></div>
    </div>

    <section id="game" hidden aria-label="数独">
      <div class="game-top">
        <span id="game-meta"></span>
        <span class="game-actions">
          <button id="g-hint" type="button">要提示</button>
          <button id="g-step" type="button">你来下一步</button>
          <button id="g-new" type="button">新局</button>
        </span>
      </div>
      <div id="board" role="grid"></div>
      <div id="pad"></div>
      <div id="game-say" class="say"></div>
    </section>

    <section id="radio" hidden aria-label="电台">
      <div class="deck" id="deck">
        <div class="deck-line"><span id="deck-title">—</span><span id="deck-time">--:--</span></div>
        <div class="deck-bar" id="deck-bar" aria-hidden="true"></div>
      </div>
      <div class="radio-make">
        <input id="pod-topic" type="text" maxlength="100" placeholder="想听什么（可空）">
        <button id="pod-run" type="button">来一期</button>
      </div>
      <p id="pod-status" class="memory-status"></p>
      <ol id="episodes"></ol>
    </section>

    <div id="attachments"></div>
    <form id="composer">
      <button id="attach" class="round flat" type="button" aria-label="发图片">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <input id="file" type="file" accept="image/*" multiple hidden>
      <textarea id="input" rows="1" placeholder="说点什么…" enterkeyhint="send"></textarea>
      <button id="send" class="round solid" type="submit" aria-label="发送">
        <svg class="i-send" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"/></svg>
        <svg class="i-stop" viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="7" width="10" height="10" rx="2"/></svg>
      </button>
    </form>

    <nav id="tabs" aria-label="页面">
      <button type="button" data-page="chat" aria-current="true">对话</button>
      <button type="button" data-page="radio" id="tab-radio" hidden>电台</button>
      <button type="button" data-page="board">棋盘</button>
    </nav>
  </main>

  <dialog id="settings">
    <form method="dialog">
      <h2>设置</h2>
      <label class="field"><span>模型</span>
        <select id="model"></select>
      </label>
      <label class="field"><span>系统提示词</span>
        <textarea id="system-prompt" rows="9"></textarea>
        <small>每次对话都会带上，决定它怎么说话、怎么称呼你。</small>
      </label>
      <fieldset class="group">
        <legend>主动消息</legend>
        <label class="switch"><input type="checkbox" id="pro-on"><span>允许它主动找我（发消息并推送到手机）</span></label>
        <div class="row3">
          <label class="field"><span>安静时段从</span><input type="time" id="pro-qs" value="23:00"></label>
          <label class="field"><span>到</span><input type="time" id="pro-qe" value="09:00"></label>
          <label class="field"><span>每天最多</span>
            <select id="pro-max"><option>1</option><option>2</option><option selected>3</option><option>4</option><option>5</option><option>6</option></select>
          </label>
        </div>
        <div class="push-actions">
          <button id="push-enable" type="button">开启本机通知</button>
          <button id="push-test" type="button">测试通知</button>
          <button id="pro-run" type="button">现在试一条</button>
        </div>
        <p id="push-status" class="memory-status"></p>
      </fieldset>
      <p id="memory-status" class="memory-status"></p>
      <p id="weread-status" class="memory-status"></p>
      <p id="device-status" class="memory-status"></p>
      <div class="danger-zone">
        <button id="reset" type="button">清空聊天重新开始</button>
        <button id="logout" type="button" hidden>退出登录</button>
      </div>
      <div class="dialog-actions">
        <button value="cancel">取消</button>
        <button id="save-settings" value="save" class="primary">保存</button>
      </div>
    </form>
  </dialog>

  <dialog id="new-game">
    <form method="dialog">
      <h2>新开一盘</h2>
      <div class="level-pick">
        <button value="easy" type="submit">简单</button>
        <button value="medium" type="submit">中等</button>
        <button value="hard" type="submit">困难</button>
      </div>
      <div class="dialog-actions"><button value="cancel">取消</button></div>
    </form>
  </dialog>

  <script src="/vendor/marked.js"></script>
  <script src="/vendor/purify.js"></script>
  <script src="/app.js"></script>
</body>
</html>
