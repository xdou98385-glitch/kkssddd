<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111318">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Chat">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icon-180.png">
  <link rel="icon" href="/icon.svg">
  <link rel="stylesheet" href="/style.css">
  <title>Chat</title>
</head>
<body>
  <main>
    <header>
      <div id="title">Claude</div>
      <button id="settings-btn" class="icon" title="设置">⚙</button>
    </header>
    <div id="messages"><div class="empty">想聊点什么？</div></div>
    <div id="attachments"></div>
    <form id="composer">
      <button id="attach" class="icon" type="button" title="发图片">＋</button>
      <input id="file" type="file" accept="image/*" multiple hidden>
      <textarea id="input" rows="1" placeholder="发消息…" enterkeyhint="send"></textarea>
      <button id="send" class="primary" type="submit">发送</button>
    </form>
  </main>

  <dialog id="settings">
    <form method="dialog">
      <h3>设置</h3>
      <label class="field">模型
        <select id="model"></select>
      </label>
      <label class="field">系统提示词
        <textarea id="system-prompt" rows="9"></textarea>
      </label>
      <p class="hint">每次对话都会带上，决定它怎么说话、怎么称呼你。</p>
      <div class="danger-zone">
        <button id="reset" type="button">清空聊天重新开始</button>
        <button id="logout" type="button" hidden>退出登录</button>
      </div>
      <div class="dialog-actions">
        <button value="cancel">取消</button>
        <button id="save-settings" value="save" class="primary">保存</button>
      </div>
    </form>
  </dialog>

  <script src="/vendor/marked.js"></script>
  <script src="/vendor/purify.js"></script>
  <script src="/app.js"></script>
</body>
</html>
