<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111318">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Chat">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icon-180.png">
  <link rel="icon" href="/icon.svg">
  <link rel="stylesheet" href="/style.css">
  <title>Chat</title>
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div class="side-head">
        <button id="new-chat" class="primary">＋ 新对话</button>
        <button id="settings-btn" class="icon" title="设置">⚙</button>
      </div>
      <ul id="conv-list"></ul>
    </aside>
    <div id="scrim"></div>
    <main>
      <header>
        <button id="menu-btn" class="icon" title="对话列表">☰</button>
        <div id="title">新对话</div>
        <select id="model"></select>
      </header>
      <div id="messages"><div class="empty">想聊点什么？</div></div>
      <form id="composer">
        <textarea id="input" rows="1" placeholder="发消息…" enterkeyhint="send"></textarea>
        <button id="send" class="primary" type="submit">发送</button>
      </form>
    </main>
  </div>

  <dialog id="settings">
    <form method="dialog">
      <h3>系统提示词</h3>
      <p class="hint">每次对话都会带上，可以写你希望它怎么说话、怎么称呼你。</p>
      <textarea id="system-prompt" rows="8"></textarea>
      <div class="dialog-actions">
        <button id="logout" type="button" hidden>退出登录</button>
        <button value="cancel">取消</button>
        <button id="save-settings" value="save" class="primary">保存</button>
      </div>
    </form>
  </dialog>

  <script src="/vendor/marked.js"></script>
  <script src="/vendor/purify.js"></script>
  <script src="/app.js"></script>
</body>
</html>
