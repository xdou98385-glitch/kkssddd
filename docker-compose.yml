services:
  chat:
    build: .
    restart: unless-stopped
    env_file: .env
    # 用宿主机网络：这样容器里的 127.0.0.1:5230 就是服务器上的 Memos。
    # 同时让站点只监听本机，外网访问不到，靠 Tailscale serve/funnel 转发出来。
    network_mode: host
    environment:
      HOST: 127.0.0.1
      # 写死在这里：environment 优先于 .env，防止 .env 里的 DB_PATH 把库指到容器内部
      DB_PATH: /data/chat.db
    volumes:
      - ./data:/data
